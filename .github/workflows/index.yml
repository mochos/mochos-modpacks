name: Generar índice

on:
  push:
    branches: [main]
    paths: ["modpacks/**", "servidores/**", "scripts/**", "desarrollo.json"]
  pull_request:
    paths: ["modpacks/**", "servidores/**", "scripts/**", "desarrollo.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar y generar index.json
        run: node scripts/build-index.mjs
      - name: Publicar index.json
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet index.json; then
            echo "index.json sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: regenerar index.json"
          git push
